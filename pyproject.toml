[build-system]
requires = ["setuptools>=64", "wheel", "numpy", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q3dviewer"
version = "1.3.4"
authors = [
    {name = "Liu Yang", email = "liu.yang@jp.panasonic.com"}
]
description = "A library designed for quickly deploying a 3D viewer."
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pyside6",
    "PyOpenGL",
    "meshio",
    "pypcd4",
    "pye57",
    "laspy",
    "imageio",
    "pyproj",
    "requests",
    "rich",
]

[project.optional-dependencies]
tools = [
    "imageio[ffmpeg]",
    "matplotlib",
]
cuda = [
    "pybind11>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/scomup/q3dviewer"

[project.scripts]
"q3d.cloud_viewer" = "q3dviewer.tools.cloud_viewer:main"
"q3d.cloud_editor" = "q3dviewer.tools.cloud_editor:main"
"q3d.compare_viewer" = "q3dviewer.tools.compare_viewer:main"
"q3d.ros_viewer" = "q3dviewer.tools.ros_viewer:main"
"q3d.mesh_viewer" = "q3dviewer.tools.mesh_viewer:main"
"q3d.gaussian_viewer" = "q3dviewer.tools.gaussian_viewer:main"
"q3d.lidar_cam_calib" = "q3dviewer.tools.lidar_cam_calib:main"
"q3d.lidar_calib" = "q3dviewer.tools.lidar_calib:main"
"q3d.film_maker" = "q3dviewer.tools.film_maker:main"
"q3d.matching_cloud" = "q3dviewer.tools.matching_cloud:main"

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.package-data]
q3dviewer = [
    "shaders/*.glsl",
    "tools/cloud_editor/icons/*.svg",
    "tools/cloud_editor/icons/README.md",
]
